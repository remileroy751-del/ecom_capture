<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; media-src 'self' blob:; img-src 'self' data:">
<title>Ecom Capture</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; }
  .bubble {
    position: absolute; inset: 14px; border-radius: 50%; overflow: hidden; background: #0d0f14;
    box-shadow: 0 0 0 3px rgba(255,255,255,.92), 0 4px 10px rgba(0,0,0,.35);
    -webkit-app-region: drag;
  }
  video { width: 100%; height: 100%; object-fit: cover; display: block; }
  video.mirror { transform: scaleX(-1); }
  #x {
    -webkit-app-region: no-drag; position: absolute; top: 2px; left: 50%; margin-left: -13px;
    width: 26px; height: 26px; border-radius: 50%; border: 0; padding: 0; cursor: pointer;
    background: rgba(20,23,30,.9); color: #fff; font: 700 14px/1 "Segoe UI", sans-serif;
    opacity: 0; transition: opacity .15s;
  }
  body:hover #x, #x:focus-visible { opacity: 1; }
  .err .bubble::after { content: "Caméra indisponible"; position: absolute; inset: 0; display: grid; place-items: center; color: #fff; font: 13px "Segoe UI", sans-serif; text-align: center; padding: 20px; }
</style>
</head>
<body>
  <div class="bubble"><video id="v" autoplay muted playsinline></video></div>
  <button id="x" type="button" aria-label="Fermer">✕</button>
  <script src="webcam.js"></script>
</body>
</html>
