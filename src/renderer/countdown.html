<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>Ecom Capture</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none; }
  body { display: grid; place-items: center; }
  .disc {
    width: 200px; height: 200px; border-radius: 50%;
    display: grid; place-items: center;
    background: rgba(20, 23, 30, .88); border: 4px solid #ff3b47;
    color: #fff; font: 700 110px/1 "Bahnschrift", "Segoe UI", sans-serif;
  }
  .disc.pop { animation: pop .9s ease-out; }
  @keyframes pop { 0% { transform: scale(.7); opacity: 0; } 25% { transform: scale(1.04); opacity: 1; } 100% { transform: scale(1); } }
  @media (prefers-reduced-motion: reduce) { .disc.pop { animation: none; } }
</style>
</head>
<body>
  <div class="disc" id="n" aria-live="assertive"></div>
  <script src="countdown.js"></script>
</body>
</html>
